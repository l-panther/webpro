<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetch and error handling | WebPro Lab</title><style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,sans-serif;background:#f1f4f8;color:#142e52;margin:0;padding:clamp(16px,4vw,50px)}main{max-width:800px;margin:auto;background:white;border:1px solid #dfe6ef;border-radius:22px;padding:clamp(20px,4vw,42px)}h1{line-height:1.2}h2{font-size:1.15rem}label{display:block;font-weight:650;margin:14px 0}input,textarea{display:block;width:100%;padding:12px;margin-top:5px;border:1px solid #aab8c9;border-radius:10px;font:inherit}button{border:0;background:#142e52;color:white;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d68a34;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}.grid article{padding:18px;border:1px solid #dfe6ef;border-radius:12px}.count{font-size:3rem;font-weight:800}.output,pre{background:#f1f4f8;padding:15px;border-radius:10px;overflow:auto}li{margin:8px 0}#status{color:#3d7a6b;font-weight:650}.note{background:#edf4fb;border-left:4px solid #3d7a6b;padding:14px;margin-top:22px}a{color:#174b85}</style></head><body><main><p><a href="../index.html">← WebPro home</a></p><p style="font-size:.75rem;font-weight:800;letter-spacing:.12em;color:#3d7a6b">RUNNABLE LAB · VANILLA WEB</p><h1>Fetch and error handling</h1><p>Inspect this file's HTML, CSS and JavaScript to understand how the demo works. It runs without a build tool.</p><button id="load">Load sample JSON</button><p id="status" role="status"></p><pre id="output"></pre><aside class="note"><strong>Verify:</strong> Click Load. Then change the URL to an invalid endpoint and observe the error path.</aside></main><script>const status=document.querySelector('#status');const output=document.querySelector('#output');document.querySelector('#load').onclick=async()=>{status.textContent='Loading…';output.textContent='';try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),6000);let response;try{response=await fetch('data:application/json,%7B%22items%22%3A%5B%22HTML%22%2C%22CSS%22%2C%22JS%22%5D%7D',{signal:controller.signal})}finally{clearTimeout(timer)}if(!response.ok)throw Error(`HTTP ${response.status}`);const data=await response.json();if(!Array.isArray(data.items))throw Error('Unexpected response');output.textContent=JSON.stringify(data,null,2);status.textContent='Loaded successfully'}catch(err){status.textContent=`Could not load: ${err.message}`}};</script></body></html>
