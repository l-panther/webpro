<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Testable price calculator | WebPro Lab</title><style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,sans-serif;background:#f1f4f8;color:#142e52;margin:0;padding:clamp(16px,4vw,50px)}main{max-width:800px;margin:auto;background:white;border:1px solid #dfe6ef;border-radius:22px;padding:clamp(20px,4vw,42px)}h1{line-height:1.2}h2{font-size:1.15rem}label{display:block;font-weight:650;margin:14px 0}input,textarea{display:block;width:100%;padding:12px;margin-top:5px;border:1px solid #aab8c9;border-radius:10px;font:inherit}button{border:0;background:#142e52;color:white;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d68a34;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}.grid article{padding:18px;border:1px solid #dfe6ef;border-radius:12px}.count{font-size:3rem;font-weight:800}.output,pre{background:#f1f4f8;padding:15px;border-radius:10px;overflow:auto}li{margin:8px 0}#status{color:#3d7a6b;font-weight:650}.note{background:#edf4fb;border-left:4px solid #3d7a6b;padding:14px;margin-top:22px}a{color:#174b85}</style></head><body><main><p><a href="../index.html">← WebPro home</a></p><p style="font-size:.75rem;font-weight:800;letter-spacing:.12em;color:#3d7a6b">RUNNABLE LAB · VANILLA WEB</p><h1>Testable price calculator</h1><p>Inspect this file's HTML, CSS and JavaScript to understand how the demo works. It runs without a build tool.</p><label>Quantity <input id="quantity" type="number" min="0" max="10000" value="2"></label><label>Unit price (£) <input id="price" type="number" min="0" max="100000" step="0.01" value="12.50"></label><button id="calculate">Calculate</button><p id="result" role="status"></p><aside class="note"><strong>Verify:</strong> Test 0, decimals, a large value, negative values and blank fields.</aside></main><script>function total(quantity,price){if(!Number.isFinite(quantity)||!Number.isFinite(price)||quantity<0||price<0)throw Error('Enter non-negative numbers');return Math.round((quantity*price+Number.EPSILON)*100)/100}document.querySelector('#calculate').onclick=()=>{const q=document.querySelector('#quantity');const p=document.querySelector('#price');const out=document.querySelector('#result');if(!q.reportValidity()||!p.reportValidity())return;try{out.textContent=new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(total(Number(q.value),Number(p.value)))}catch(e){out.textContent=e.message}};</script></body></html>
